# Explicitly opt in: docker compose -f compose.yaml -f compose.vpn.yaml ...
# Bot keeps its own network namespace; only Telegram uses this SOCKS service.
services:
  bot:
    environment:
      TELEGRAM_PROXY: socks5://vpn:1080
    depends_on:
      vpn:
        condition: service_healthy
  vpn:
    image: itishkino-promobot-vpn:awg2-1-amd64
    platform: linux/amd64
    restart: unless-stopped
    init: true
    read_only: true
    cpus: 0.5
    mem_limit: 128m
    pids_limit: 96
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, NET_RAW, SETUID, SETGID]
    security_opt: ["no-new-privileges:true"]
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      net.ipv6.conf.all.disable_ipv6: "1"
      net.ipv6.conf.default.disable_ipv6: "1"
    tmpfs:
      - /run:rw,noexec,nosuid,size=8m,mode=755
      - /tmp:rw,noexec,nosuid,size=8m,mode=1777
    volumes:
      - type: bind
        source: ${PROMOBOT_RUNTIME_DIR:-./runtime}/vpn-resolv.conf
        target: /etc/resolv.conf
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${PROMOBOT_RUNTIME_DIR:-./runtime}/awg0.conf
        target: /run/secrets/awg0.conf
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: [CMD, python3, /app/entrypoint.py, health]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
