[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "itishkino-promobot"
version = "0.3.1"
description = "Persistent Telegram family intake and conservative Alfa CRM delivery"
requires-python = ">=3.11,<3.15"
dependencies = ["aiogram==3.31.0", "httpx==0.28.1", "aiosqlite==0.22.1", "phonenumbers==9.0.16", "python-dotenv==1.2.1", "aiohttp-socks==0.11.0"]

[project.optional-dependencies]
test = ["pytest==8.4.2", "pytest-asyncio==1.2.0"]

[project.scripts]
promobot = "promobot.cli:main"

[tool.setuptools.package-data]
promobot = ["migrations/*.sql"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
