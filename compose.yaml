name: itishkino-promobot
services:
  bot:
    build: .
    image: itishkino-promobot:0.4.0-amd64
    platform: linux/amd64
    cpus: 0.75
    mem_limit: 256m
    pids_limit: 64
    restart: unless-stopped
    init: true
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 30s
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - type: bind
        source: ${PROMOBOT_RUNTIME_DIR:-./runtime}/.env
        target: /run/promobot/.env
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${PROMOBOT_RUNTIME_DIR:-./runtime}/config.json
        target: /run/promobot/config.json
        read_only: true
        bind:
          create_host_path: false
      - data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  data:
